    Research Experience:
      - company: Carnegie Mellon University
        position: Visiting Researcher
        location: Hybrid
        start_date: 2026-09
        end_date: present
        summary: Egocentric VLMs for surgical performance assessment and corrective feedback in central venous catheterization, advised by Justin Chan.
        highlights:
          - Developing an egocentric video-understanding framework for procedural assessment under motion blur, operator variability, and changing tool distance.
          - Investigating zero- and few-shot recognition of procedural steps, tools, and execution errors.
          - Designing evidence-grounded error reasoning and actionable corrective feedback.

      - company: Cornell University
        position: Research Intern
        location: New York, NY
        start_date: 2026
        end_date: 2026
        summary: Exploratory research on expressive voice adaptation in AAC conversation with Thijs Roumen and Tobias Weinberg.
        highlights:
          - Designed low-cost interaction techniques for voice adaptation during semi-structured conversation.
          - Framed evaluation around self-expression, partner interpretation, conversational flow, and control burden.

      - company: MIT Media Lab
        position: Research Intern
        location: Cambridge, MA
        start_date: 2025-05
        end_date: 2025-09
        summary: VoiceMorph research with Pattie Maes and Kye Shimizu.
        highlights:
          - Built a real-time TouchDesigner system integrating a deep-learning voice-morphing model.
          - Analyzed more than 2,000 trials from 21 participants to model perceptual boundaries of voice identity.
          - Led acoustic quality control and synthesized quantitative and qualitative findings.

      - company: Cornell University
        position: Research Assistant
        location: Ithaca, NY
        start_date: 2024-02
        end_date: 2024-09
        summary: Emotional voice integration in ASL translators with Cheng Zhang and Hyunchul Lim.
        highlights:
          - Engineered an emotional neural text-to-speech pipeline spanning five categories.
          - Designed studies with 93 hearing and 48 Deaf or hard-of-hearing participants.
          - Processed approximately 100 ASL videos and led statistical and visualization analysis.

      - company: Cornell University
        position: Research Intern
        location: Ithaca, NY
        start_date: 2024-06
        end_date: 2024-08
        summary: Large-scale arXiv reading behavior analysis with Yian Yin.
        highlights:
          - Analyzed 4.8 million users after filtering automated traffic.
          - Built structured timelines linking access dates, referral sources, and engagement depth.

      - company: Cornell University
        position: Research Assistant
        location: Ithaca, NY
        start_date: 2023-09
        end_date: 2023-12
        summary: Persuasive chatbot research with Susan Fussell.
        highlights:
          - Built a responsive React interface for human–AI conversation studies.
          - Integrated GPT-4 and automated conversation logging for researcher review.

    Selected Projects:
      - name: HopIn
        summary: Accessible ride-sharing platform concept for mobility equity in Ithaca.
        start_date: 2025-08
        end_date: 2025-12
        highlights:
          - Led user research with low-income and disabled riders, TCAT staff, and local advocates.
          - Translated findings into Figma prototypes for ride matching, medical trips, and accessibility-support workflows.
          - Iterated through expert reviews and user tests.

      - name: Low-voice recognition on a smartwatch
        summary: Wrist-worn whispered-command interface using active ultrasonic sensing.
        start_date: 2025-01
        end_date: 2025-05
        highlights:
          - Built a 3D-printed device with dual ultrasonic speakers and microphones controlled by a Teensy 4.1.
          - Collected 6,380 labeled utterances from four participants across 29 commands.
          - Trained a modified four-channel ResNet-18, reaching 55% accuracy and 0.56 macro F1.

